name: Playwright E2E Tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  e2e-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        # Solo chromium y sin --with-deps: el runner ya trae las librerías de Chrome,
        # y el apt de --with-deps (24,9 MB del espejo de Ubuntu) llegó a tardar 9 min
        # y a cancelar el job por el timeout de 10 min (27/10/2026).
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          # Inyectamos variables Dummy para que el backend no aborte de inmediato por lack of config (env.config.ts)
          SUPABASE_URL: "http://dummy-supabase.url"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-key"
          GEMINI_API_KEY: "dummy-key"
          GROQ_API_KEY: "dummy-key"
          REDIS_URL: "redis://localhost:6379"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 15
